name: Upload to CurseForge
on:
  push:
    branches:
      - main
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create zip
        run: |
          mkdir HandyNotes_ValTeleports
          cp *.lua *.toc HandyNotes_ValTeleports/
          zip -r HandyNotes_ValTeleports.zip HandyNotes_ValTeleports
      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: "${{ secrets.HANDYNOTESVALTELEPORTS }}"
          project_id: "1601281"
          game_endpoint: "wow"
          file_path: "HandyNotes_ValTeleports.zip"
          game_versions: "12.0.7"
          release_type: "release"
          display_name: "HandyNotes_ValTeleports - ${{ github.event.head_commit.timestamp }}"
          changelog: "${{ github.event.head_commit.message }}"
          changelog_type: "markdown"
